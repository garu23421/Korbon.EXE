<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Вход</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="login.html" class="active">Вход</a></li>
      </ul>
    </nav>
  </header>

  <section class="container auth-section fade-in">
    <div class="auth-wrapper">
      <h2>Вход</h2>
      <p>Введи ник и пароль</p>

      <form id="login-form" class="enhanced-form">
        <div class="form-group">
          <label for="username">Позывной / Ник</label>
          <input type="text" id="username" required placeholder="Твой ник">
        </div>

        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" required placeholder="Твой пароль">
        </div>

        <button type="submit" class="submit-btn">Войти</button>
      </form>

      <p class="auth-link">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>

      <div id="login-message" class="auth-message hidden"></div>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
