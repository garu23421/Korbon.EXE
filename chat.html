<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Чат</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <script src="https://js.pusher.com/8.2/pusher.min.js"></script>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="chat.html" class="active">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container chat-section fade-in">
    <div class="chat-header">
      <h2>Общий канал синдиката</h2>
      <p>Говори. Слушай. Не выдавай.</p>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
      <input type="text" id="nickname" placeholder="Твой ник" value="Anonymous" maxlength="20">
      <input type="text" id="message" placeholder="Сообщение..." required autocomplete="off">
      <button type="submit" class="submit-btn">Отправить</button>
    </form>

    <button onclick="clearChat()" class="clear-chat">Очистить чат</button>
  </section>

  <footer class="fixed-footer">
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script>
    // Вставь свои ключи от Pusher
    Pusher.logToConsole = true;
    const pusher = new Pusher('YOUR_PUSHER_KEY', {
      cluster: 'YOUR_PUSHER_CLUSTER'
    });

    const channel = pusher.subscribe('korbon-chat');
    const messagesDiv = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const nicknameInput = document.getElementById('nickname');
    const messageInput = document.getElementById('message');

    // Загрузка сообщений при подключении
    channel.bind('new-message', (data) => {
      const div = document.createElement('div');
      div.className = 'chat-message';
      div.innerHTML = `
        <div class="message-header">
          <strong>${data.nick}</strong>
          <small>${data.time}</small>
        </div>
        <div class="message-text">${data.text}</div>
      `;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // Отправка сообщения
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const nick = nicknameInput.value.trim() || 'Anonymous';
      const text = messageInput.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      fetch('https://YOUR_PUSHER_APP_ID.pusherapp.com/trigger', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
    app_id = "2106536"
    key = "9c5cc01d01dc7c4dad38"
    secret = "e65dd9efe19332aeee21"
    cluster = "eu"
          data: { nick, text, time }
        })
      });

      messageInput.value = '';
    });

    // Очистка чата (локально)
    function clearChat() {
      if (confirm('Очистить чат?')) messagesDiv.innerHTML = '';
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
