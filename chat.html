<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Чат</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <script src="https://js.pusher.com/8.2/pusher.min.js"></script>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="chat.html" class="active">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container chat-section fade-in">
    <div class="chat-header">
      <h2>Общий канал синдиката</h2>
      <p>Сообщения видны всем онлайн в реальном времени</p>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
      <input type="text" id="nickname" placeholder="Твой ник" value="Anonymous" maxlength="20">
      <input type="text" id="message" placeholder="Напиши сообщение..." required autocomplete="off">
      <button type="submit" class="submit-btn">Отправить</button>
    </form>

    <button onclick="clearChat()" class="clear-chat">Очистить чат (только у тебя)</button>
  </section>

  <footer class="fixed-footer">
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script>
    // Твои ключи
    const PUSHER_KEY = '9c5cc01d01dc7c4dad38';
    const PUSHER_CLUSTER = 'eu';
    const PUSHER_APP_ID = '2106536';

    // Подключаемся к Pusher
    const pusher = new Pusher(PUSHER_KEY, {
      cluster: PUSHER_CLUSTER,
      forceTLS: true
    });

    const channel = pusher.subscribe('korbon-chat');

    const messagesDiv = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const nicknameInput = document.getElementById('nickname');
    const messageInput = document.getElementById('message');

    // Получаем сообщения в реальном времени
    channel.bind('new-message', (data) => {
      addMessage(data.nick, data.text, data.time);
    });

    function addMessage(nick, text, time) {
      const div = document.createElement('div');
      div.className = 'chat-message';
      div.innerHTML = `
        <div class="message-header">
          <strong>${nick}</strong>
          <small>${time}</small>
        </div>
        <div class="message-text">${text}</div>
      `;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Отправка сообщения
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nick = nicknameInput.value.trim() || 'Anonymous';
      const text = messageInput.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const payload = {
        name: 'new-message',
        channels: ['korbon-chat'],
        data: JSON.stringify({ nick, text, time })
      };

      try {
        const response = await fetch(`https://api-${PUSHER_CLUSTER}.pusher.com/apps/${PUSHER_APP_ID}/events?auth_key=${PUSHER_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`Ошибка ${response.status}: ${errText}`);
        }

        messageInput.value = '';
      } catch (err) {
        console.error('Ошибка отправки:', err);
        alert('Не удалось отправить. Проверь консоль (F12).');
      }
    });

    // Очистка чата (только у тебя локально)
    function clearChat() {
      if (confirm('Очистить чат только у себя?')) {
        messagesDiv.innerHTML = '';
      }
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
