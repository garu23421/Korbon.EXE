<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Чат</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDK (compat-версия, работает без type="module") -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="chat.html" class="active">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container chat-section fade-in">
    <div class="chat-header">
      <h2>Общий канал</h2>
      <p>Сообщения видны всем онлайн в реальном времени</p>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
      <input type="text" id="nickname" placeholder="Твой ник" value="Anonymous" maxlength="20">
      <input type="text" id="message" placeholder="Сообщение..." required autocomplete="off">
      <button type="submit" class="submit-btn">Отправить</button>
    </form>

    <button onclick="clearChat()" class="clear-chat">Очистить чат (локально)</button>
  </section>

  <footer class="fixed-footer">
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script>
    // Ваш Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyD6PoTmUk9ejWbxyX6HSc51odaIt_we1Gk",
      authDomain: "korbonchat.firebaseapp.com",
      databaseURL: "https://korbonchat-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "korbonchat",
      storageBucket: "korbonchat.firebasestorage.app",
      messagingSenderId: "855813386160",
      appId: "1:855813386160:web:9a4363e6e781e77c797075",
      measurementId: "G-Y8VY6ZJ708"
    };

    // Инициализация Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref('korbon-chat');

    const messagesDiv = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const nicknameInput = document.getElementById('nickname');
    const messageInput = document.getElementById('message');

    // Получаем сообщения в реальном времени
    messagesRef.on('child_added', (snapshot) => {
      const msg = snapshot.val();
      const div = document.createElement('div');
      div.className = 'chat-message';
      div.innerHTML = `
        <div class="message-header">
          <strong>${msg.nick || 'Anonymous'}</strong>
          <small>${msg.time}</small>
        </div>
        <div class="message-text">${msg.text}</div>
      `;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    // Отправка сообщения
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const nick = nicknameInput.value.trim() || 'Anonymous';
      const text = messageInput.value.trim();
      if (!text) return;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      messagesRef.push({
        nick,
        text,
        time
      });

      messageInput.value = '';
    });

    // Очистка чата (только у тебя локально)
    function clearChat() {
      if (confirm('Очистить чат только у себя?')) {
        messagesDiv.innerHTML = '';
      }
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
