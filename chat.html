<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Чат</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <style>
    .chat-messages {
      height: 400px;
      overflow-y: auto;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .chat-message {
      margin: 0.5rem 0;
      padding: 0.8rem;
      background: rgba(0,255,157,0.1);
      border-radius: 8px;
    }
    .chat-message strong {
      color: var(--accent);
    }
    .chat-form {
      display: flex;
      gap: 1rem;
    }
    .chat-form input {
      flex: 1;
      padding: 0.8rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: white;
    }
    .chat-form button {
      padding: 0.8rem 1.5rem;
    }
    .clear-chat {
      margin-top: 1rem;
      background: #ff2d55;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="chat.html" class="active">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container chat-section fade-in">
    <h2>Общий чат синдиката</h2>

    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
      <input type="text" id="message" placeholder="Напиши сообщение..." required>
      <button type="submit" class="submit-btn">Отправить</button>
    </form>

    <button class="clear-chat" onclick="clearChat()">Очистить чат (для теста)</button>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    const currentUser = localStorage.getItem('currentUser');
    if (!currentUser) {
      window.location.href = 'login.html';
    }

    const messagesDiv = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');

    function loadMessages() {
      const messages = JSON.parse(localStorage.getItem('korbonChat')) || [];
      messagesDiv.innerHTML = '';
      messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'chat-message';
        div.innerHTML = `<strong>${msg.user}:</strong> ${msg.text} <small>(${msg.time})</small>`;
        messagesDiv.appendChild(div);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    loadMessages();

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('message').value.trim();
      if (!text) return;

      const messages = JSON.parse(localStorage.getItem('korbonChat')) || [];
      const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      messages.push({ user: currentUser, text, time });
      localStorage.setItem('korbonChat', JSON.stringify(messages));

      document.getElementById('message').value = '';
      loadMessages();
    });

    function clearChat() {
      if (confirm('Очистить весь чат?')) {
        localStorage.removeItem('korbonChat');
        loadMessages();
      }
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
