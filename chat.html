<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Чат</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="chat.html" class="active">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container chat-section fade-in">
    <div class="chat-header">
      <h2>Общий канал синдиката</h2>
      <p>Говори. Слушай. Не выдавай.</p>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
      <input type="text" id="nickname" placeholder="Твой ник" value="Anonymous" maxlength="20">
      <input type="text" id="message" placeholder="Напиши сообщение..." required autocomplete="off">
      <button type="submit" class="submit-btn">Отправить</button>
    </form>

    <button onclick="clearChat()" class="clear-chat">Очистить чат</button>
  </section>

  <footer class="fixed-footer">
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script>
    const messagesDiv = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const nicknameInput = document.getElementById('nickname');
    const messageInput = document.getElementById('message');

    // Загрузка сообщений
    function loadMessages() {
      const messages = JSON.parse(localStorage.getItem('korbonChat')) || [];
      messagesDiv.innerHTML = '';
      messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'chat-message';
        div.innerHTML = `
          <div class="message-header">
            <strong>${msg.nick}</strong>
            <small>${msg.time}</small>
          </div>
          <div class="message-text">${msg.text}</div>
        `;
        messagesDiv.appendChild(div);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    loadMessages();

    // Отправка сообщения
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const nick = nicknameInput.value.trim() || 'Anonymous';
      const text = messageInput.value.trim();
      if (!text) return;

      const messages = JSON.parse(localStorage.getItem('korbonChat')) || [];
      const time = new Date().toLocaleString('ru-RU', {
        hour: '2-digit',
        minute: '2-digit',
        day: '2-digit',
        month: '2-digit'
      });

      messages.push({ nick, text, time });
      localStorage.setItem('korbonChat', JSON.stringify(messages));

      messageInput.value = '';
      loadMessages();
    });

    // Очистка чата
    function clearChat() {
      if (confirm('Очистить весь чат? Это действие нельзя отменить.')) {
        localStorage.removeItem('korbonChat');
        loadMessages();
      }
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
