<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Чат</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="chat.html" class="active">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container chat-page fade-in">
    <div class="chat-sidebar">
      <h3>Пользователи</h3>
      <div id="user-list"></div>
    </div>

    <div class="chat-main">
      <div class="chat-header">
        <h2 id="chat-title">Общий чат</h2>
        <p id="user-status">Загрузка...</p>
      </div>

      <div id="chat-messages" class="chat-messages"></div>

      <form id="chat-form" class="chat-form hidden">
        <input type="text" id="nickname" placeholder="Твой ник" maxlength="20">
        <input type="text" id="message" placeholder="Сообщение..." autocomplete="off">
        <label class="file-label">
          <input type="file" id="file-input" accept="image/*,.pdf,.txt,.zip" hidden>
          📎
        </label>
        <button type="submit" class="submit-btn">Отправить</button>
      </form>

      <button id="login-btn" class="submit-btn">Войти через Google</button>
      <button id="logout-btn" class="action-btn hidden">Выйти</button>
      <button onclick="clearChat()" class="clear-chat">Очистить (локально)</button>
    </div>
  </section>

  <footer class="fixed-footer">
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script>
    // Твой config
    const firebaseConfig = {
      apiKey: "AIzaSyD6PoTmUk9ejWbxyX6HSc51odaIt_we1Gk",
      authDomain: "korbonchat.firebaseapp.com",
      databaseURL: "https://korbonchat-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "korbonchat",
      storageBucket: "korbonchat.firebasestorage.app",
      messagingSenderId: "855813386160",
      appId: "1:855813386160:web:9a4363e6e781e77c797075",
      measurementId: "G-Y8VY6ZJ708"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    const storage = firebase.storage();

    const messagesDiv = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const nicknameInput = document.getElementById('nickname');
    const messageInput = document.getElementById('message');
    const fileInput = document.getElementById('file-input');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userStatus = document.getElementById('user-status');
    const chatTitle = document.getElementById('chat-title');
    const userList = document.getElementById('user-list');

    const ADMIN_UID = 'L2S9TT19NbXxkhGiaEpEItVQ48u1';

    let currentUser = null;
    let currentChat = 'global'; // 'global' или uid собеседника

    // Слушаем вход
    auth.onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        userStatus.textContent = `Привет, ${user.displayName || user.email.split('@')[0]}`;
        loginBtn.classList.add('hidden');
        logoutBtn.classList.remove('hidden');
        chatForm.classList.remove('hidden');
        nicknameInput.value = user.displayName || 'Anonymous';
        loadUsers();
      } else {
        userStatus.textContent = 'Войди через Google';
        loginBtn.classList.remove('hidden');
        logoutBtn.classList.add('hidden');
        chatForm.classList.add('hidden');
      }
    });

    // Вход / выход
    loginBtn.addEventListener('click', () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider);
    });

    logoutBtn.addEventListener('click', () => auth.signOut());

    // Загрузка списка пользователей
    function loadUsers() {
      db.ref('users').on('value', snapshot => {
        userList.innerHTML = '<div class="user-item" onclick="openChat(\'global\')">Общий чат</div>';
        snapshot.forEach(child => {
          const u = child.val();
          if (u.uid !== currentUser.uid) {
            const div = document.createElement('div');
            div.className = 'user-item';
            div.innerHTML = `<img src="${u.photoURL || 'https://via.placeholder.com/32/111/00ff9d?text=' + u.name[0]}" class="small-avatar"> ${u.name}`;
            div.onclick = () => openChat(u.uid);
            userList.appendChild(div);
          }
        });
      });
    }

    // Открытие чата
    function openChat(uid) {
      currentChat = uid;
      messagesDiv.innerHTML = '';
      chatTitle.textContent = uid === 'global' ? 'Общий чат' : 'ЛС с пользователем';

      const chatPath = uid === 'global' ? 'korbon-chat' : `dm/${[currentUser.uid, uid].sort().join('_')}`;
      messagesRef.off();
      messagesRef = db.ref(chatPath);
      messagesRef.on('child_added', snapshot => {
        const msg = snapshot.val();
        const key = snapshot.key;
        const isAdmin = currentUser.uid === ADMIN_UID;
        const isOwn = msg.uid === currentUser.uid;

        const div = document.createElement('div');
        div.className = `chat-message ${isOwn ? 'own' : ''}`;
        let content = `
          <img src="${msg.photoURL || 'https://via.placeholder.com/40/111/00ff9d?text=' + msg.nick[0]}" class="chat-avatar" alt="avatar">
          <div class="message-content">
            <div class="message-header">
              <strong>${msg.nick}</strong>
              <small>${msg.time}</small>
              ${isAdmin ? `<button class="delete-btn" onclick="deleteMessage('${key}', '${chatPath}')">Удалить</button>` : ''}
            </div>
            <div class="message-text">${msg.text}</div>
        `;

        if (msg.fileURL) {
          if (msg.fileType.startsWith('image')) {
            content += `<img src="${msg.fileURL}" class="chat-image" alt="прикрепленное фото">`;
          } else {
            content += `<a href="${msg.fileURL}" target="_blank" class="chat-file">📎 ${msg.fileName}</a>`;
          }
        }

        content += `</div>`;
        div.innerHTML = content;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    // Отправка сообщения + файл
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!auth.currentUser) return alert('Сначала войди');

      const nick = nicknameInput.value.trim() || auth.currentUser.displayName || 'Anonymous';
      const text = messageInput.value.trim();
      const file = fileInput.files[0];

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const chatPath = currentChat === 'global' ? 'korbon-chat' : `dm/${[auth.currentUser.uid, currentChat].sort().join('_')}`;
      const newMsgRef = db.ref(chatPath).push();

      let fileURL = null;
      let fileName = null;
      let fileType = null;

      if (file) {
        if (file.size > 5 * 1024 * 1024) return alert('Файл слишком большой (макс 5 МБ)');
        const storageRef = storage.ref(`chat-files/${newMsgRef.key}_${file.name}`);
        await storageRef.put(file);
        fileURL = await storageRef.getDownloadURL();
        fileName = file.name;
        fileType = file.type;
      }

      newMsgRef.set({
        uid: auth.currentUser.uid,
        nick,
        text,
        time,
        photoURL: auth.currentUser.photoURL || null,
        fileURL,
        fileName,
        fileType
      });

      messageInput.value = '';
      fileInput.value = '';
    });

    // Удаление сообщения
    function deleteMessage(key, chatPath) {
      if (confirm('Удалить сообщение навсегда?')) {
        db.ref(chatPath).child(key).remove().catch(err => {
          console.error(err);
          alert('Не удалось удалить');
        });
      }
    }

    // Локальная очистка
    function clearChat() {
      if (confirm('Очистить чат только у себя?')) messagesDiv.innerHTML = '';
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
