<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Чат</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="profile.html">Профиль</a></li>
        <li><a href="users.html">Пользователи</a></li>
        <li><a href="chat.html" class="active">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container chat-section fade-in">
    <h2>Общий чат</h2>
    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form">
      <input type="text" id="message" placeholder="Напиши сообщение..." required>
      <button type="submit" class="submit-btn">Отправить</button>
    </form>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    const currentUser = localStorage.getItem('currentUser');
    if (!currentUser) {
      window.location.href = 'login.html';
    }

    const messagesDiv = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');

    // Загрузка сообщений
    const loadMessages = () => {
      const messages = JSON.parse(localStorage.getItem('korbonChat')) || [];
      messagesDiv.innerHTML = '';
      messages.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'chat-message';
        div.innerHTML = `<strong>${msg.user}:</strong> ${msg.text} <small>(${msg.time})</small>`;
        messagesDiv.appendChild(div);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    };

    loadMessages();

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('message').value.trim();
      if (!text) return;

      const messages = JSON.parse(localStorage.getItem('korbonChat')) || [];
      const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      messages.push({ user: currentUser, text, time });
      localStorage.setItem('korbonChat', JSON.stringify(messages));

      document.getElementById('message').value = '';
      loadMessages();
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
