<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Пользователи</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="profile.html">Профиль</a></li>
        <li><a href="users.html" class="active">Пользователи</a></li>
        <li><a href="chat.html">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container users-section fade-in">
    <h2 class="glow-title">Синдикат KorbonEXE</h2>
    <p class="subtitle">Зарегистрированные оперативники</p>

    <div id="users-list" class="users-grid"></div>

    <div id="no-users" class="auth-message hidden">
      Пока нет зарегистрированных пользователей. Стань первым!
    </div>
  </section>

  <footer class="fixed-footer">
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    const currentUser = localStorage.getItem('currentUser');
    if (!currentUser) {
      window.location.href = 'login.html';
    }

    const users = JSON.parse(localStorage.getItem('korbonUsers')) || {};
    const list = document.getElementById('users-list');
    const noUsers = document.getElementById('no-users');

    if (Object.keys(users).length === 0) {
      noUsers.classList.remove('hidden');
    } else {
      Object.keys(users).forEach(username => {
        const user = users[username];

        const card = document.createElement('div');
        card.className = 'user-card fade-in';
        card.innerHTML = `
          <div class="avatar-frame">
            <img src="${user.avatar}" alt="${username}" class="user-avatar">
          </div>
          <h3 class="username">${username}</h3>
          <p class="status">${user.status || 'Новобранец'}</p>
          <p class="discord">${user.discord || 'Не указан'}</p>
        `;
        list.appendChild(card);
      });
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
