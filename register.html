<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Регистрация</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="register.html" class="active">Регистрация</a></li>
      </ul>
    </nav>
  </header>

  <section class="container auth-section fade-in">
    <div class="auth-wrapper">
      <h2>Регистрация</h2>
      <p>Создай аккаунт для доступа к профилю</p>

      <form id="register-form" class="enhanced-form">
        <div class="form-group">
          <label for="username">Позывной / Ник *</label>
          <input type="text" id="username" required placeholder="Твой ник">
        </div>

        <div class="form-group">
          <label for="password">Пароль *</label>
          <input type="password" id="password" required placeholder="Минимум 6 символов">
        </div>

        <div class="form-group">
          <label for="discord">Discord (необязательно)</label>
          <input type="text" id="discord" placeholder="@username#0000">
        </div>

        <div class="form-group">
          <label for="avatar-url">Ссылка на аватар (необязательно)</label>
          <input type="url" id="avatar-url" placeholder="https://example.com/avatar.png">
        </div>

        <button type="submit" class="submit-btn">Зарегистрироваться</button>
      </form>

      <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>

      <div id="register-message" class="auth-message hidden"></div>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
