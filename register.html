<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Регистрация</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="register.html" class="active">Регистрация</a></li>
      </ul>
    </nav>
  </header>

  <section class="container auth-section fade-in">
    <div class="auth-wrapper">
      <h2>Регистрация через Discord</h2>
      <p>Авторизуйся через Discord для создания профиля</p>

      <button id="discord-login" class="submit-btn">Войти через Discord (в popup)</button>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script>
    const discordLogin = document.getElementById('discord-login');
    discordLogin.addEventListener('click', () => {
      const clientId = '1464613664710590668'; // Твой Client ID из Discord App
      const redirectUri = encodeURIComponent('https://garu23421.github.io/Korbon.EXE/callback.html');
      const oauthUrl = `https://discord.com/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=identify%20guilds`;

      // Открываем popup
      const popup = window.open(oauthUrl, 'discordLogin', 'width=500,height=700,left=200,top=100');

      // Проверяем, закрылся ли popup
      const checkClosed = setInterval(() => {
        if (popup.closed) {
          clearInterval(checkClosed);
          location.reload(); // Обновляем страницу для проверки сессии
        }
      }, 1000);
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
