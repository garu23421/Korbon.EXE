<!DOCTYPE html>
<html lang="ru">

        <li><a href="register.html" class="active">Регистрация</a></li>
      </ul>

  <section class="container auth-section fade-in">
    <div class="auth-wrapper">
      <h2>Регистрация через Discord</h2>
      <p>Авторизуйся через Discord для создания профиля</p>

      <button id="discord-login" class="submit-btn">Войти через Discord</button>
      <p id="auth-message" class="auth-message hidden"></p>
    </div>

  <footer>

  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient('https://dirtfyjgmkzzzlclktcx.supabase.co', 'sb_secret_kNtTVPtuwKNQgkvbKDPGXQ_IKtXRS8H');

    const discordLogin = document.getElementById('discord-login');
    discordLogin.addEventListener('click', async () => {
      const { data, error } = await supabase.auth.signInWithOAuth({
        provider: 'discord',
        options: {
          redirectTo: 'https://garu23421.github.io/Korbon.EXE/profile.html' // Точный URI (проверь регистр!)
        }
      });

      if (error) {
        document.getElementById('auth-message').textContent = 'Ошибка: ' + error.message;
        document.getElementById('auth-message').classList.add('error');
        document.getElementById('auth-message').classList.remove('hidden');
      }
    });
  </script>
  <script src="script.js"></script>
