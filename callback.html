<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Callback</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <section class="container auth-section fade-in">
    <div class="auth-wrapper">
      <p id="callback-message" class="auth-message">Обработка авторизации...</p>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient('https://dirtfyjgmkzzzlclktcx.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpcnRmeWpnbWt6enpsY2xrdGN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyNjI5MjQsImV4cCI6MjA4NDgzODkyNH0.asn8nYEFYXMVLOLNX3V9tl6mHhHns838gNoH_RYOHfw');

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');

    if (state !== localStorage.getItem('oauth_state')) {
      document.getElementById('callback-message').textContent = 'Ошибка авторизации. Попробуй снова.';
      document.getElementById('callback-message').classList.add('error');
      return;
    }

    // Автоматическая обработка после redirect
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        // Успешный логин — перенаправляем на профиль
        window.location.href = 'profile.html';
      } else {
        document.getElementById('callback-message').textContent = 'Ошибка. Попробуй снова.';
        document.getElementById('callback-message').classList.add('error');
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
