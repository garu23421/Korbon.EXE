<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Callback</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <section class="container auth-section fade-in">
    <div class="auth-wrapper">
      <p class="auth-message success">Авторизация успешна! Закрываю окно...</p>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script>
    // Если это popup — обновляем родительскую страницу и закрываемся
    if (window.opener) {
      window.opener.location.reload();
      setTimeout(() => window.close(), 1000);
    } else {
      // Если открыто напрямую — перенаправляем на профиль
      window.location.href = 'profile.html';
    }
  </script>
  <script src="script.js"></script>
</body>
</html>
