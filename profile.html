<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Профиль</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="profile.html" class="active">Профиль</a></li>
        <li><a href="users.html">Пользователи</a></li>
        <li><a href="chat.html">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container profile-section fade-in">
    <div class="profile-card">
      <div class="profile-header">
        <img id="avatar-preview" class="profile-avatar" src="" alt="Аватар">
        <h2 id="username-display">Загрузка...</h2>
      </div>

      <div class="profile-body">
        <p><strong>Discord:</strong> <span id="discord-display">Не указан</span></p>
        <p><strong>Статус:</strong> <span id="status-display">Новобранец</span></p>
      </div>

      <form id="edit-form" class="profile-form">
        <div class="form-group">
          <label for="new-status">Новый статус</label>
          <input type="text" id="new-status" placeholder="Расскажи о себе">
        </div>

        <div class="form-group">
          <label for="avatar-file">Загрузить аватар</label>
          <input type="file" id="avatar-file" accept="image/*">
        </div>

        <div class="form-group">
          <label for="avatar-url">Или ссылка на аватар</label>
          <input type="url" id="avatar-url" placeholder="https://...">
        </div>

        <button type="submit" class="submit-btn neon-btn">Сохранить</button>
      </form>

      <button id="logout" class="action-btn logout-btn">Выйти</button>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    // Предпросмотр аватара при выборе файла
    document.getElementById('avatar-file').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('avatar-preview').src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
