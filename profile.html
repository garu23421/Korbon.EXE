<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Профиль</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="profile.html" class="active">Профиль</a></li>
      </ul>
    </nav>
  </header>

  <section class="container profile-section fade-in">
    <div class="profile-wrapper">
      <h2>Личный профиль</h2>

      <div class="profile-info">
        <img id="avatar" class="character-img" src="" alt="Аватар">
        <p>Ник: <span id="username"></span></p>
        <p>Discord ID: <span id="discord-id"></span></p>
        <p>Статус: <span id="status">Новобранец</span></p>
      </div>

      <form id="edit-form" class="enhanced-form">
        <div class="form-group">
          <label for="new-status">Изменить статус</label>
          <input type="text" id="new-status" placeholder="Новый статус">
        </div>
        <button type="submit" class="submit-btn">Сохранить</button>
      </form>

      <button id="logout" class="action-btn">Выйти</button>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient('YOUR_SUPABASE_URL', 'YOUR_ANON_KEY');

    // Проверка сессии
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.href = 'register.html';
      return;
    }

    const user = session.user;

    // Сохраняем/обновляем профиль
    const { error: upsertError } = await supabase
      .from('users')
      .upsert({
        id: user.id,
        username: user.user_metadata.full_name || user.user_metadata.preferred_username,
        discord_id: user.user_metadata.provider_id,
        avatar: user.user_metadata.avatar_url,
        status: 'Новобранец'
      });

    // Загружаем профиль
    const { data: profile } = await supabase
      .from('users')
      .select('*')
      .eq('id', user.id)
      .single();

    document.getElementById('username').textContent = profile.username;
    document.getElementById('discord-id').textContent = profile.discord_id;
    document.getElementById('avatar').src = profile.avatar;
    document.getElementById('status').textContent = profile.status || 'Новобранец';
    document.getElementById('new-status').value = profile.status || '';

    // Редактирование статуса
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newStatus = document.getElementById('new-status').value;

      await supabase
        .from('users')
        .update({ status: newStatus })
        .eq('id', user.id);

      document.getElementById('status').textContent = newStatus;
      alert('Статус обновлён!');
    });

    // Выход
    document.getElementById('logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
