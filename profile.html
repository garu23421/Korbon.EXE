<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Профиль</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="profile.html" class="active">Профиль</a></li>
        <li><a href="users.html">Пользователи</a></li>
        <li><a href="chat.html">Чат</a></li>
      </ul>
    </nav>
  </header>

  <section class="container profile-section fade-in">
    <div class="profile-wrapper">
      <h2>Личный профиль</h2>

      <div class="profile-info">
        <img id="avatar" class="character-img" src="" alt="Аватар">
        <p>Ник: <span id="username"></span></p>
        <p>Discord: <span id="discord"></span></p>
        <p>Статус: <input id="status" type="text" placeholder="Введи статус"></p>
      </div>

      <button id="save-profile" class="submit-btn">Сохранить</button>
      <button id="logout" class="action-btn">Выйти</button>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient('YOUR_SUPABASE_URL', 'YOUR_ANON_KEY');

    const { data: { user } } = await supabase.auth.getUser();
    if (!user) window.location.href = 'register.html';

    const { data: profile } = await supabase.from('users').select('*').eq('id', user.id).single();
    document.getElementById('username').textContent = user.user_metadata.full_name;
    document.getElementById('discord').textContent = user.user_metadata.provider_id;
    document.getElementById('avatar').src = user.user_metadata.avatar_url;
    document.getElementById('status').value = profile.status || '';

    document.getElementById('save-profile').addEventListener('click', async () => {
      const status = document.getElementById('status').value;
      await supabase.from('users').update({ status }).eq('id', user.id);
      alert('Профиль обновлён!');
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
