<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KorbonEXE — Профиль</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <header>
    <nav class="navbar">
      <div class="logo-container">
        <img src="/logo.jpg" alt="KorbonEXE">
      </div>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="about.html">Биография</a></li>
        <li><a href="join.html">Вступить</a></li>
        <li><a href="gallery.html">Галерея</a></li>
        <li><a href="profile.html" class="active">Профиль</a></li>
      </ul>
    </nav>
  </header>

  <section class="container profile-section fade-in">
    <div class="profile-wrapper">
      <h2>Личный профиль</h2>

      <div class="profile-info">
        <img id="avatar-preview" class="character-img" src="" alt="Аватар">
        <p>Ник: <span id="username-display"></span></p>
        <p>Discord: <span id="discord-display"></span></p>
        <p>Статус: <span id="status-display"></span></p>
      </div>

      <form id="edit-form" class="enhanced-form">
        <div class="form-group">
          <label for="new-status">Изменить статус</label>
          <input type="text" id="new-status" placeholder="Новый статус">
        </div>

        <div class="form-group">
          <label for="new-avatar">Ссылка на новый аватар</label>
          <input type="url" id="new-avatar" placeholder="https://example.com/avatar.png">
        </div>

        <button type="submit" class="submit-btn">Сохранить изменения</button>
      </form>

      <button id="logout" class="action-btn">Выйти</button>
    </div>
  </section>

  <footer>
    <p>© 2026 KorbonEXE. All rights reserved. .EXE не прощает ошибок.</p>
  </footer>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
